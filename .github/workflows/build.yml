name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.7'
      - name: Decrypt signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "KEYSTORE_PASSWORD 비밀값이 없습니다"; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in app/release.keystore.enc -out app/release.p12 -pass env:KEYSTORE_PASSWORD
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: Remove decrypted key
        if: always()
        run: rm -f app/release.p12
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MonthlyWidget.apk
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 달력 위젯 v${{ github.run_number }}
          files: MonthlyWidget.apk
          make_latest: true
